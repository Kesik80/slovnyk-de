<body>
<header>
  <h1>Wörter</h1>
  <button class="ic" id="themeBtn" data-act="theme" aria-label="Тема">🌓</button>
</header>
<main id="view"></main>
<nav>
  <button data-act="tab" data-t="list"><b>📚</b>Слова</button>
  <button data-act="tab" data-t="review"><b>🧠</b>Повтор<span class="badge" id="bdg" style="display:none"></span></button>
  <button data-act="tab" data-t="more"><b>⚙️</b>Ещё</button>
</nav>
<div id="modal"></div>
<div id="dlgHost"></div>
<div id="toast"></div>
<input type="file" id="fXlsx" accept=".xlsx,.xls" multiple hidden>
<input type="file" id="fTxt" accept=".txt,.csv,.tsv,text/plain,text/csv" hidden>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>
<input type="file" id="fCsv" accept=".csv,text/csv,text/plain" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/*LOGIC*/
const COLS=['Тема','Под Темой','Слово','Перевод','Теги','Изображение','Звук','Определение','Спряжение','Склонение','Примеры','Произношение','Транскрипция'];
const KEYS=['theme','sub','word','tr','tags','image','sound','def','conj','decl','ex','pron','ipa'];
const PRON=['ich','du','er','wir','ihr','sie','es'];
const DAY=86400000, LEARN=[1,10], RELEARN=[10], AHEAD=20*60000;
function str(v){return v==null?'':String(v);}

/* ---- таблицы [! ... !] ---- */
function parseFlat(inner){
  const tk=inner.trim().split(/\s+/).filter(Boolean), out=[]; let cur=null;
  for(let i=0;i<tk.length;){
    const t=tk[i];
    if(PRON.indexOf(t.toLowerCase())>=0 && i+1<tk.length){
      if(!cur){cur={title:'',rows:[]};out.push(cur);}
      cur.rows.push([t,tk[i+1]]); i+=2;
    } else { cur={title:t,rows:[]}; out.push(cur); i++; }
  }
  return out;
}
function parseBlocks(inner){
  inner=inner.replace(/\r\n?/g,'\n');
  if(inner.indexOf('\n')<0 && inner.indexOf('\t')<0) return parseFlat(inner);
  const out=[];
  inner.split(/\n[ \t]*\n/).forEach(chunk=>{
    const lines=chunk.split('\n').filter(l=>l.trim()!=='');
    if(!lines.length) return;
    const b={title:'',rows:[]};
    if(lines[0].indexOf('\t')<0){b.title=lines[0].trim();lines.shift();}
    lines.forEach(l=>b.rows.push(l.split('\t')));
    out.push(b);
  });
  return out;
}
function parseRich(s){
  s=str(s).replace(/\r\n?/g,'\n');
  const blocks=[]; let found=false;
  const rest=s.replace(/\[!([\s\S]*?)!\]/g,(m,inner)=>{found=true;parseBlocks(inner).forEach(b=>blocks.push(b));return '\n';});
  if(!found) return {text:s,blocks:[]};
  return {text:rest.replace(/\n{2,}/g,'\n').trim(),blocks};
}
function serBlocks(blocks){
  return blocks.map(b=>{
    const lines=[]; if(b.title) lines.push(b.title);
    b.rows.forEach(r=>{ if(r.some(c=>str(c).trim()!=='')) lines.push(r.join('\t')); });
    return lines.join('\n');
  }).filter(x=>x!=='').join('\n\n');
}
function buildRich(text,blocks){
  text=str(text).trim();
  const body=serBlocks(blocks), tbl=body?'[!'+body+'!]':'';
  return text&&tbl?text+'\n'+tbl:(text||tbl);
}

/* ---- таблица спряжения как сетка: местоимения | Präsens | Präteritum | Perfekt ---- */
const PRON_RX=/^(ich|du|er|sie|es|wir|ihr|er\/sie\/es|er\/sie|sie\/Sie)$/i;
function toGrid(blocks){
  if(blocks.some(b=>b.rows.some(r=>r.length>2))) return null;   // обычные многоколоночные таблицы не трогаем
  let lead=null; const cols=[];
  blocks.forEach(b=>{
    const two=b.rows.some(r=>r.length>=2);
    if(two){ if(!lead) lead=b.rows.map(r=>str(r[0])); cols.push({title:b.title,cells:b.rows.map(r=>str(r[1]))}); return; }
    let items=b.rows.map(r=>str(r[0]));
    if(b.title&&PRON_RX.test(b.title.trim())) items=[b.title].concat(items);
    const all=items.filter(x=>x.trim()!=='');
    if(!lead&&!cols.length&&all.length>1&&all.every(x=>PRON_RX.test(x.trim()))){ lead=items; return; }
    cols.push({title:b.title,cells:items});
  });
  lead=lead||[];
  const n=Math.max(lead.length,...cols.map(c=>c.cells.length),0);
  while(lead.length<n) lead.push('');
  cols.forEach(c=>{while(c.cells.length<n)c.cells.push('');});
  return {lead,cols};
}
function fromGrid(g){
  const n=g.lead.length;
  if(!g.cols.length) return n?[{title:'',rows:g.lead.map(x=>[x,''])}]:[];
  return g.cols.map(c=>({title:c.title,rows:g.lead.map((x,i)=>[x,c.cells[i]||''])}));
}

/* ---- xlsx <-> модель ---- */
function parseSheet(aoa){
  aoa=aoa.map(r=>r.map(str));
  let head=(aoa[0]||[]).map(h=>h.trim()), map=[], extraCols=[];
  const lower=COLS.map(c=>c.toLowerCase());
  const hasHead=head.some(h=>lower.indexOf(h.toLowerCase())>=0);
  let start=1;
  if(!hasHead){ head=COLS.slice(); start=0; }
  head.forEach((h,i)=>{
    const k=lower.indexOf(h.toLowerCase());
    if(k>=0) map[i]=KEYS[k]; else if(h){map[i]='x:'+h; if(extraCols.indexOf(h)<0) extraCols.push(h);} else map[i]=null;
  });
  const rows=[]; let migrated=0;
  for(let r=start;r<aoa.length;r++){
    const row=aoa[r], o={extra:{}};
    KEYS.forEach(k=>o[k]='');
    row.forEach((v,i)=>{const k=map[i]; if(!k) return; if(k.slice(0,2)==='x:') o.extra[k.slice(2)]=v; else if(!o[k]) o[k]=v;});
    const any=KEYS.some(k=>o[k].trim()!=='')||Object.keys(o.extra).some(k=>o.extra[k]!=='');
    if(!any) continue;
    const onlyTheme=o.theme.trim()!==''&&KEYS.every(k=>k==='theme'||o[k].trim()==='')&&Object.keys(o.extra).every(k=>o.extra[k]==='');
    if(onlyTheme){rows.push({kind:'h',theme:o.theme,extra:{}});continue;}
    // перенос краткой формы из «Примеры» в «Спряжение», если там таблица [! !]
    if(o.conj.indexOf('[!')>=0 && /^\s*[^\n]+ · [^\n]+ · [^\n]+\s*$/.test(o.ex) && o.decl.trim()===''){
      const p=parseRich(o.conj);
      if(p.text===''){o.conj=buildRich(o.ex.trim(),p.blocks); o.ex=''; migrated++;}
    }
    o.kind='w'; rows.push(o);
  }
  return {rows,extraCols,migrated};
}
function toAoa(words,extraCols){
  const out=[COLS.concat(extraCols)];
  words.slice().sort((a,b)=>a.ord-b.ord).forEach(w=>{
    let r;
    if(w.kind==='h') r=[w.theme];
    else r=KEYS.map(k=>w[k]).concat(extraCols.map(c=>(w.extra&&w.extra[c])||''));
    r=r.map(v=>str(v)===''?null:str(v));
    while(r.length&&r[r.length-1]===null) r.pop();
    out.push(r);
  });
  return out;
}

/* ---- SM-2 (как в Anki) ---- */
function newCard(){return {state:0,step:0,due:0,dd:0,ivl:0,ease:2.5,reps:0,lapses:0};}
function dayNum(t){const d=new Date(t-4*3600000);return Math.floor((t-4*3600000-d.getTimezoneOffset()*60000)/DAY);}
function reviewIvls(c){
  const hard=Math.max(c.ivl+1,Math.round(c.ivl*1.2));
  const good=Math.max(hard+1,Math.round(c.ivl*c.ease));
  const easy=Math.max(good+1,Math.round(c.ivl*c.ease*1.3));
  return {2:hard,3:good,4:easy};
}
function schedule(c0,g,now){
  const c=Object.assign({},c0); c.reps++;
  if(c.state===2){
    if(g===1){c.lapses++;c.ease=Math.max(1.3,c.ease-0.2);c.ivl=1;c.state=3;c.step=0;c.due=now+RELEARN[0]*60000;}
    else{
      const iv=reviewIvls(c); c.ivl=iv[g];
      c.ease=Math.max(1.3,c.ease+(g===2?-0.15:g===4?0.15:0));
      c.dd=dayNum(now)+c.ivl; c.due=0;
    }
    return c;
  }
  const steps=c.state===3?RELEARN:LEARN, relearn=c.state===3;
  if(c.state===0){c.state=1;c.step=0;}
  const grad=easy=>{
    c.state=2;c.step=0;
    c.ivl=relearn?(easy?Math.max(c.ivl,1)+1:Math.max(c.ivl,1)):(easy?4:1);
    c.dd=dayNum(now)+c.ivl;c.due=0;
  };

  else if(g===2){
    const m=c.step===0?(steps.length>1?(steps[0]+steps[1])/2:steps[0]*1.5):steps[c.step];
    c.due=now+Math.round(m*60000);
  }
  else if(g===3){
    if(c.step+1<steps.length){c.step++;c.due=now+steps[c.step]*60000;} else grad(false);
  }
  else grad(true);

}

function fmtNext(c,now){

}

/* ---- список слов: через новую строку или запятую; «слово ; перевод» ---- */
function parseWordList(text){
  const out=[];
  String(text||'').replace(/\r/g,'').split('\n').forEach(line=>{
    line=line.trim(); if(!line) return;
    if(/[;\t]/.test(line)){const q=line.split(/\s*[;\t]\s*/);if(q[0].trim())out.push({word:q[0].trim(),tr:(q[1]||'').trim()});return;}
    const parts=line.split(/\s*,\s*/).filter(Boolean);
    // «der Tisch, Tische» — это одно слово с множественным числом, а не два слова
    if(parts.length===2&&/^(der|die|das)\s/i.test(parts[0])&&!/\s/.test(parts[1])&&!/^(der|die|das)$/i.test(parts[1])&&/^[A-ZÄÖÜ]/.test(parts[1])){out.push({word:parts[0]+', '+parts[1],tr:''});return;}
    parts.forEach(w=>out.push({word:w,tr:''}));
  });
  return out;
}
function parseSentList(text){
  const out=[];
  String(text||'').replace(/\r/g,'').split('\n').forEach(line=>{
    line=line.trim(); if(!line) return;
    const q=line.split(/\s*[;\t]\s*|\s+[—–]\s+/);
    if(q[0].trim()) out.push({word:q[0].trim(),tr:(q[1]||'').trim()});
  });
  return out;
}
/* ---- CSV из «Озвучки», имена аудио, статистика ---- */
function parseCsv(text){
  text=str(text).replace(/^\uFEFF/,'');
  const first=text.split('\n')[0]||'', d=first.split(';').length>=first.split(',').length?';':',';
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===d){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur);cur=''; if(row.some(x=>x!=='')) rows.push(row); row=[]; }
    else cur+=c;
  }
  row.push(cur); if(row.some(x=>x!=='')) rows.push(row);
  return rows;
}
function ozvToWords(rows){
  if(!rows.length) return [];
  const h=rows[0].map(x=>str(x).trim().toLowerCase()), ix=n=>h.indexOf(n);
  const iw=ix('слово'), ib=ix('словарная форма'), it=ix('перевод'), ie=ix('пример'), is=ix('статус');
  if(iw<0&&ib<0) return [];
  const seen=new Set(), out=[];
  rows.slice(1).forEach(r=>{
    const word=str(r[ib]).trim()||str(r[iw]).trim(); if(!word) return;
    const k=word.toLowerCase(); if(seen.has(k)) return; seen.add(k);
    out.push({word,tr:str(r[it]).trim(),ex:str(r[ie]).trim(),status:str(r[is]).trim()});
  });
  return out;
}
function slug(s){return str(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'word';}

function calcStats(log,today){
  const by={}; log.forEach(l=>{const d=dayNum(l.ts);by[d]=(by[d]||0)+1;});
  let streak=0,d=by[today]?today:today-1; while(by[d]){streak++;d--;}
  const days=[]; for(let i=13;i>=0;i--) days.push({d:today-i,n:by[today-i]||0});
  const recent=log.filter(l=>dayNum(l.ts)>today-30), good=recent.filter(l=>l.g>=3).length;
  return {streak,days,total:log.length,today:by[today]||0,acc:recent.length?Math.round(good/recent.length*100):null};
}

function eligible(theme){return realWords().filter(w=>str(w.word).trim()&&str(w.tr).trim()&&(!theme||w.theme===theme));}
function newCount(){
  const d=dayNum(Date.now()), m=S.meta.newcount;
  return m&&m.day===d?m:{day:d,wt:0,tw:0};
}
function limitNew(){return Math.max(0,+(localStorage.getItem('wt_newlimit')||10));}
function queueInfo(mode,theme){
  const dir=mode==='wt'?'wt':'tw', now=Date.now(), today=dayNum(now), nc=newCount();
  const lrn=[],rev=[],nw=[];
  eligible(theme).forEach(w=>{
    const c=(w.srs&&w.srs[dir])||newCard();
    if(c.state===0) nw.push({w,dir,c});
    else if(c.state===2){ if(c.dd<=today) rev.push({w,dir,c}); }
    else if(c.due<=now+AHEAD) lrn.push({w,dir,c});
  });
  lrn.sort((a,b)=>a.c.due-b.c.due); nw.sort((a,b)=>a.w.ord-b.w.ord);
  const room=Math.max(0,limitNew()-(nc[dir]||0)), newList=nw.slice(0,room);
  return {lrn,rev,newList,nNew:newList.length,nRev:rev.length,nLrn:lrn.length,totalNew:nw.length};
}
function pickCard(q){
  const now=Date.now(), due=q.lrn.find(x=>x.c.due<=now);
  return due||q.rev[0]||q.newList[0]||q.lrn[0]||null;
}

async function grade(g){

/* ---------- импорт / экспорт ---------- */
function needXlsx(){if(typeof XLSX==='undefined'){toast('Библиотека xlsx не загружена (нужен интернет при первом запуске)');return false;}return true;}
async function doImport(file,forced,silent){
  if(!needXlsx()) return;
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets['Sheet1']||wb.Sheets[wb.SheetNames[0]];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false});
    const p=parseSheet(aoa);
    if(!p.rows.length){toast('В файле нет строк');return;}
    const has=S.words.length>0;
    let mode='replace';
    if(has&&forced) mode=forced;
    else if(has){
      mode=await ask('В файле '+p.rows.length+' строк. Что сделать?',[
        {t:'Слить (прогресс сохранится)',v:'merge',cls:'pri'},{t:'Заменить словарь (прогресс по совпавшим словам сохранится)',v:'replace'},{t:'Отмена',v:null}]);
      if(!mode) return;
    }
    flushSaves();
    const byKey=new Map(S.words.map(w=>[keyOf(w),w]));
    let added=0,upd=0,out=[];
    if(mode==='replace'){
      out=p.rows.map((r,i)=>{
        const old=byKey.get(keyOf(r)), w=blankWord(r);
        w.ord=i+1; w.kind=r.kind; if(old){w.id=old.id; w.srs=old.srs; upd++;} else added++;
        return w;
      });
      await dbClear('words'); await dbPutMany('words',out); S.words=out;
    } else {
      let ord=S.words.reduce((m,w)=>Math.max(m,w.ord),0);
      const touched=[];
      p.rows.forEach(r=>{
        const old=byKey.get(keyOf(r));
        if(old){ if(r.kind==='w'){KEYS.forEach(k=>old[k]=r[k]);old.extra=r.extra;} touched.push(old); upd++; }
        else{ const w=blankWord(r); w.kind=r.kind; w.ord=r.kind==='h'?++ord:newOrd(r.theme,r.sub); S.words.push(w); byKey.set(keyOf(w),w); touched.push(w); added++; }
      });
      await dbPutMany('words',touched);
    }
    const ex=S.meta.extraCols||[]; p.extraCols.forEach(c=>{if(!ex.includes(c))ex.push(c);}); await setMeta('extraCols',ex);
    const msg='Импорт: добавлено '+added+', обновлено '+upd+(p.migrated?'; форма перенесена в «Спряжение»: '+p.migrated:'');
    render();
    if(silent) return msg;
    toast(msg);
  }catch(e){fail(e);}
}
function buildXlsx(){
  const aoa=toAoa(S.words,S.meta.extraCols||[]);
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:14},{wch:14},{wch:16},{wch:22},{wch:10},{wch:10},{wch:10},{wch:24},{wch:34},{wch:20},{wch:30},{wch:12},{wch:12}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Sheet1');
  return XLSX.write(wb,{bookType:'xlsx',type:'array'});
}
function doExport(){

async function doRestore(file){
  try{
    const d=JSON.parse(await file.text());
    if(d.app!=='woerter'||!Array.isArray(d.words)) throw new Error('Это не копия Wörter');
    const ok=await ask('Заменить все текущие данные копией ('+d.words.filter(w=>w.kind!=='h').length+' слов)?',[{t:'Восстановить',v:true,cls:'pri'},{t:'Отмена',v:false}]);
    if(!ok) return;

const nf=n=>Number(n||0).toLocaleString('ru-RU');
function b64enc(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function b64dec(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
function niceErr(j){
  const c=String(j.code||'');
  return c==='paid_voice'?j.error:/quota/.test(c)?(j.error||'кончились символы'):/invalid_api_key/.test(c)?'ключ не работает':/voice_not_found/.test(c)?'голоса нет в этом аккаунте — выберите голос заново':null;
}
/* единый вызов /api/<name>: код доступа, таймаут, понятные ошибки. opt.buf — ответ это файл (ArrayBuffer) */
async function callApi(name,body,opt){
  opt=opt||{};
  for(let t=0;t<2;t++){
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),opt.ms||65000);
    let r;
    try{r=await fetch('/api/'+name,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},PASS?{'x-ozv-pass':PASS}:{}),body:JSON.stringify(body),signal:ctl.signal});}
    catch(e){throw new Error(e.name==='AbortError'?'сервер не ответил вовремя':'нет связи с сервером');}
    finally{clearTimeout(tm);}
    if(r.ok){
      if(opt.buf) return {buf:await r.arrayBuffer(),key:parseInt(r.headers.get('X-Key'),10)};
      return r.json();
    }
    let j={};try{j=await r.json();}catch(e){}
    if(r.status===404&&!j.error&&!j.code) throw new Error('функция /api/'+name+' не найдена — страница открыта не с Vercel');
    if(j.code==='need_pass'&&t===0){
      const p=(prompt('Код доступа (OZV_PASSWORD из Vercel)','')||'').trim();
      if(!p) throw new Error('нужен код доступа');
      PASS=p;try{localStorage.setItem('wt:pass',p);}catch(e){} continue;
    }
    if(j.code==='need_pass'){PASS=null;try{localStorage.removeItem('wt:pass');}catch(e){}}
    const err=new Error(niceErr(j)||j.error||('HTTP '+r.status));err.code=j.code;throw err;
  }
  throw new Error('неверный код доступа');
}

}

/* ---- Gemini: автозаполнение ---- */
const CYR=/[а-яёіїєґ]/i;
const isSent=w=>{if(w&&w.sent)return true;const t=str(w&&w.word).trim();return t.split(/\s+/).length>=4||/[.!?…]$/.test(t);};
async function fillSentences(list){
  const d=await callApi('gemini',{a:'sent',items:list.map(w=>({text:w.word,tr:w.tr}))});
  list.forEach((w,k)=>{
    const f=d.items&&d.items[k];if(!f) return;
    const wasRu=CYR.test(w.word);
    if(wasRu&&f.de){w.sound=w.sound===audioName(w.word)?'':w.sound;w.word=f.de;}
    else if(f.de&&normAns(f.de)!==normAns(w.word)) w.word=f.de;
    if(!str(w.tr).trim()||wasRu) w.tr=f.ru||w.tr;
    w.fillFor=w.word;saveWord(w,true);
  });
}
function convIncomplete(w){
  const p=parseRich(w.conj),g=toGrid(p.blocks);
  if(!p.text.trim()&&!p.blocks.length) return false;      // не глагол или пусто: таблицу не навязываем
  return !g||g.cols.length<3||g.lead.length<6||g.cols.some(c=>c.cells.some(x=>!str(x).trim()));
}
function applyFill(w,f,overwrite){
  let n=0;
  const set=(k,v)=>{v=str(v).trim();if(!v)return;if(overwrite||!str(w[k]).trim()){if(w[k]!==v){w[k]=v;n++;}}};
  ['tr','conj','decl','ex','def'].forEach(k=>set(k,f[k]));
  set('ipa',f.ipa);
  // таблица Präsens / Präteritum / Perfekt: заполняем, если её нет или она неполная
  if([f.pres,f.prat,f.perf].every(a=>Array.isArray(a)&&a.length===6)&&(overwrite||convIncomplete(w))){
    const p=parseRich(w.conj);
    const grid={lead:PRON.slice(0,6),cols:[['Präsens',f.pres],['Präteritum',f.prat],['Perfekt',f.perf]].map(c=>({title:c[0],cells:c[1].map(str)}))};
    const nw=buildRich(p.text.trim()||str(f.conj).trim(),fromGrid(grid));
    if(nw!==w.conj){w.conj=nw;n++;}
  }
  // глагол: тема «правильные / неправильные» + «глаголы», если тема не задана
  if(f.pos==='verb'&&!str(w.theme).trim()){
    w.theme=f.irr?'неправильные':'правильные';n++;
    if(!str(w.sub).trim()) w.sub='глаголы';
    w.ord=newOrd(w.theme,w.sub);
  }
  const fw=str(f.word).trim(), ow=str(w.word).trim();
  if(fw&&CYR.test(ow)&&!CYR.test(fw)){                 // слово введено по-русски → немецкое слово из ответа
    if(w.sound===audioName(ow)||w.sound==='word.mp3') w.sound='';
    w.word=fw;n++;
  } else if(fw&&normAns(fw)!==normAns(ow)){
    const bs=x=>stripArt(normAns(x).split(',')[0].trim());
    const noArt=!/^(der|die|das)\s/i.test(ow), noPl=ow.indexOf(',')<0&&fw.indexOf(',')>=0;
    if(bs(fw)===bs(ow)&&(noArt||noPl)){w.word=fw;n++;}
  }
  w.fillFor=w.word;
  return n;
}
async function fillMany(list,onProg){
  let done=0,err=null;
  for(let i=0;i<list.length&&!S.stop;i+=10){
    const chunk=list.slice(i,i+10);
    try{
      const ss=chunk.filter(isSent),ww=chunk.filter(w=>!isSent(w));
      if(ss.length) await fillSentences(ss);
      if(ww.length){
        const d=await callApi('gemini',{a:'fill',items:ww.map(w=>({word:w.word,tr:w.tr}))});
        ww.forEach((w,k)=>{if(d.items&&d.items[k]){applyFill(w,d.items[k],false);saveWord(w,true);}});
      }
      done+=chunk.length;
    }catch(e){err=e;break;}
    if(onProg) onProg(done,list.length);
  }
  return {done,err};
}
async function runFill(list){
  S.stop=false;
  const p=progress('Gemini заполняет… 0 из '+list.length);
  const r=await fillMany(list,(d,n)=>p.set('Gemini заполняет… '+d+' из '+n));
  p.close();return r;
}

const audioMem=new Map();

async function synth(w){
  const c=voiceCfg();

let curAudio=null;
function playBuf(buf){
  try{
    if(curAudio){curAudio.pause();}
    const a=new Audio(URL.createObjectURL(new Blob([buf],{type:'audio/mpeg'})));
    curAudio=a;a.onended=()=>URL.revokeObjectURL(a.src);

  }catch(e){}
}
function ttsFallback(text){

}

}
async function speakText(key,text){

    text=String(text||'').replace(/\s*·\s*/g,', ').trim();if(!text) return;

    }

async function genAll(force){
  if(!voiceCfg().voice){toast('Сначала выберите голос: Ещё → Озвучка');return;}
  const list=[];
  for(const w of realWords()){
    if(!str(w.word).trim()) continue;
    if(!force){const r=await audioGet(w.id);if(r&&r.text===str(w.word).trim()) continue;}
    list.push(w);
  }
  if(!list.length){toast('Все слова уже озвучены');return;}
  const chars=list.reduce((n,w)=>n+elReq(w.word).text.length,0);
  const verb=force?'Переозвучить':'Озвучить';
  const ok=await ask(verb+' слов: '+list.length+' (~'+nf(chars)+' символов ElevenLabs)?',[{t:verb,v:true,cls:'pri'},{t:'Отмена',v:false}]);
  if(!ok) return;
  S.stop=false;
  const p=progress('Озвучка… 0 из '+list.length);
  let n=0,err=null;
  for(const w of list){
    if(S.stop) break;
    try{await synth(w);n++;p.set('Озвучка… '+n+' из '+list.length);}
    catch(e){err=e;break;}
  }
  p.close();
  toast(err?'Остановлено: '+err.message+' (озвучено '+n+')':'Озвучено слов: '+n);
  if(S.tab==='more') renderEl();
}

async function showVoiceList(){

function settingsChange(t){

  if(t.dataset.elc){elS()[t.dataset.elc]=t.checked;elSave();renderEl();return true;}

function elInput(t){

    const lines=S.bSent?parseSentList($('#bTxt').value):parseWordList($('#bTxt').value);
    if(!lines.length){toast('Введите '+(S.bSent?'предложения':'слова'));return;}
    const have=new Set(S.words.filter(w=>w.kind!=='h').map(keyOf)),added=[];
    lines.forEach(l=>{

  async edFill(t){
    const w=S.ed.w;
    if(!str(w.word).trim()){toast('Сначала введите слово');return;}
    touchEd();
    if(isSent(w)){
      t.textContent='…';t.disabled=true;
      try{
        const ru=CYR.test(w.word);
        await fillSentences([w]);openEditor(w.id);toast(ru?'Переведено на немецкий':'Перевод добавлен');
      }catch(e){t.textContent='✨';t.disabled=false;toast('Gemini: '+e.message);}
      return;
    }
    let over=false;
    const changed=w.fillFor&&normAns(w.fillFor)!==normAns(w.word);
    if(changed){      // слово заменили после прошлого заполнения — старые данные не годятся
      over=true;
      ['tr','conj','decl','ex','def','ipa'].forEach(k=>{w[k]='';});
      if(w.sound===audioName(w.fillFor)) w.sound='';
      if(/^(правильные|неправильные)$/.test(str(w.theme))&&str(w.sub)==='глаголы'){w.theme='';w.sub='';}
    } else if(!['tr','conj','decl','ex','def','ipa'].some(k=>!str(w[k]).trim())&&!convIncomplete(w)){
      over=await ask('Все поля уже заполнены. Перезаписать ответом Gemini?',[{t:'Перезаписать',v:true,cls:'dng'},{t:'Отмена',v:false}]);
      if(!over) return;
    }
    t.textContent='…';t.disabled=true;
    try{
      const d=await callApi('gemini',{a:'fill',items:[{word:w.word,tr:over?'':w.tr}]});
      const n=applyFill(w,d.items[0],over);saveWord(w,true);openEditor(w.id);
      toast(n?'Заполнено полей: '+n:'Нечего добавлять');
    }catch(e){t.textContent='✨';t.disabled=false;toast('Gemini: '+e.message);}
  },

  if(fs.length>1){
    const ok=await ask('Слить файлов: '+fs.length+' в один словарь? Дубли объединятся, прогресс сохранится.',[{t:'Слить',v:true,cls:'pri'},{t:'Отмена',v:false}]);
    if(!ok) return;
    const msgs=[];
    for(const f of fs){const m=await doImport(f,'merge',true);if(m)msgs.push(m);}
    toast('Файлов: '+fs.length+'. '+msgs.join(' | '));
  }
});
$('#fTxt').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const t=await f.text(),ta=$('#bTxt');if(!ta)return;
    const csv=/\.(csv|tsv)$/i.test(f.name)?t.replace(/\r/g,'').split('\n').map(l=>l.replace(/^"|"$/g,'').split(/[;\t]|","/).slice(0,2).join(' ; ').replace(/ ; $/,'')).join('\n'):t;
    ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+csv.trim();bCount();toast('Слов в списке: '+parseWordList(ta.value).length);
  }catch(err){fail(err);}
});
function bCount(){const c=$('#bCnt'),ta=$('#bTxt');if(c&&ta){const n=(S.bSent?parseSentList(ta.value):parseWordList(ta.value)).length;c.textContent=n?'слов: '+n:'';}}
function shrinkImage(file,max){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.82).split(',')[1]);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('не удалось открыть картинку'));};
    img.src=u;
  });
}
$('#fImg').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const p=progress('Читаю фото…');
  try{
    const data=await shrinkImage(f,1600);
    const d=await callApi('gemini',{a:'scan',image:data,mime:'image/jpeg'});
    const ta=$('#bTxt');
    if(ta&&d.items&&d.items.length){
      ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+d.items.map(x=>x.tr?x.word+' ; '+x.tr:x.word).join('\n');
      bCount();toast('Найдено слов: '+d.items.length+'. Проверьте список и нажмите «Добавить»');
    } else toast('На фото слов не найдено');
  }catch(err){toast('Фото: '+err.message);}
  p.close();
});
document.addEventListener('input',e=>{if(e.target.id==='bTxt')bCount();});
$('#fJson').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)doRestore(f);});
$('#fCsv').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)doOzvFile(f);});
